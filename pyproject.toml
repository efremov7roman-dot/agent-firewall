[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-firewall"
version = "0.1.0"
description = "Zero-trust runtime security for tool-using financial AI agents"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Agent Firewall contributors" }]
dependencies = [
    "pydantic>=2.10,<3",
    "langgraph>=1.2,<2",
]

[project.scripts]
agent-firewall = "agent_firewall.operations.cli:main"

[project.optional-dependencies]
dev = [
    "hypothesis>=6.125,<7",
    "mypy>=1.14,<2",
    "pytest>=8.3,<9",
    "ruff>=0.9,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agent_firewall = ["py.typed"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [
    # Frozen Phase 10 evaluator sources are preserved byte-for-byte as evidence.
    "phase10_validation/build_dataset.py",
    "phase10_validation/run.py",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
